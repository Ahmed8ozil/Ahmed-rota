<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روته أحمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230B6E78%22/%3E%3Crect%20x%3D%2211%22%20y%3D%2215%22%20width%3D%2242%22%20height%3D%2238%22%20rx%3D%226%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%2211%22%20y%3D%2215%22%20width%3D%2242%22%20height%3D%2210%22%20rx%3D%225%22%20fill%3D%22%23E8F3F4%22/%3E%3Crect%20x%3D%2211%22%20y%3D%2221%22%20width%3D%2242%22%20height%3D%224%22%20fill%3D%22%23E8F3F4%22/%3E%3Crect%20x%3D%2220%22%20y%3D%2210%22%20width%3D%224%22%20height%3D%2210%22%20rx%3D%222%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%2240%22%20y%3D%2210%22%20width%3D%224%22%20height%3D%2210%22%20rx%3D%222%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%2216%22%20y%3D%2230%22%20width%3D%229%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%23E9A91E%22/%3E%3Crect%20x%3D%2227.5%22%20y%3D%2230%22%20width%3D%229%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%23DD6A34%22/%3E%3Crect%20x%3D%2239%22%20y%3D%2230%22%20width%3D%229%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%233B4FA6%22/%3E%3Crect%20x%3D%2216%22%20y%3D%2241%22%20width%3D%229%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%233B4FA6%22/%3E%3Crect%20x%3D%2227.5%22%20y%3D%2241%22%20width%3D%229%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%238E9CA2%22/%3E%3Crect%20x%3D%2239%22%20y%3D%2241%22%20width%3D%229%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%23E9A91E%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="الروته">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0B6E78">
<style>
:root{
  --ground:#EDF1F2; --surface:#FFFFFF; --surface-2:#F6F8F9; --ink:#10272F; --muted:#5A6F77; --line:#D6DFE2; --line-strong:#B9C7CC;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DDEFF0;
  --warn:#B4541A; --warn-soft:#FBEADF; --danger:#B42842; --ok:#1E7F53;
  --shadow:0 1px 2px rgba(16,39,47,.06),0 6px 20px rgba(16,39,47,.06);
  --sans:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0B1618; --surface:#122127; --surface-2:#0F1C21; --ink:#E2EDEF; --muted:#8EA3AA; --line:#22363D; --line-strong:#334B53;
    --accent:#3DB3BC; --accent-ink:#06191C; --accent-soft:#143339;
    --warn:#F0955A; --warn-soft:#3A2518; --danger:#F07088; --ok:#4FC28D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0B1618; --surface:#122127; --surface-2:#0F1C21; --ink:#E2EDEF; --muted:#8EA3AA; --line:#22363D; --line-strong:#334B53;
  --accent:#3DB3BC; --accent-ink:#06191C; --accent-soft:#143339;
  --warn:#F0955A; --warn-soft:#3A2518; --danger:#F07088; --ok:#4FC28D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.02em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;font-family:var(--mono);letter-spacing:.06em}
nav.tabs{display:flex;gap:2px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:18px 12px 16px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.save.busy i{background:var(--warn)} .save.local i{background:var(--line-strong)}
@media (max-width:760px){ .top-in{gap:0 12px} nav.tabs{order:3;width:100%;margin:0} nav.tabs button{padding:10px 10px 10px} .save{margin-inline-start:auto} }

h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:600}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 16px}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 13px;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:34px;height:34px;display:grid;place-items:center;font-family:var(--mono)}

.banner{margin-top:18px;border:1px dashed var(--line-strong);background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.banner b{font-weight:600}
.banner .sp{flex:1;min-width:200px}

/* shift chip */
.chip{--c:#999;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 7px;border-radius:5px;background:var(--c);color:var(--ct,#fff);font-family:var(--mono);font-weight:600;font-size:12.5px;letter-spacing:.02em}
.chip.lg{min-width:62px;height:44px;font-size:20px;border-radius:8px}
.chip.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line-strong)}
.strike{text-decoration:line-through;opacity:.7}

/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.dash{grid-template-columns:1fr}}
.today{padding:20px;display:flex;flex-direction:column;gap:16px;border-inline-start:5px solid var(--c,var(--line));}
.today-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.today-name{font-size:24px;font-weight:700;line-height:1.2}
.today-time{direction:ltr;text-align:right;font-family:var(--mono);color:var(--muted);font-size:14px}
.today-meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.changed{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.next{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.next-item{display:flex;align-items:center;gap:10px;font-size:13.5px}
.next-item .d{color:var(--muted);min-width:92px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:3px}
.stat .l{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.week-strip{margin-top:16px;padding:14px 16px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.strip-d{border:1px solid var(--line);border-radius:7px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface-2);cursor:pointer}
.strip-d.is-today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.strip-d .dn{font-size:11.5px;color:var(--muted)}
.strip-d .h{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.bars{margin-top:16px;padding:14px 16px}
.bar-row{display:grid;grid-template-columns:88px 1fr 64px;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.bar{height:10px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar-row .n{font-family:var(--mono);text-align:end;color:var(--muted)}

/* roster */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cycle-nav{display:flex;align-items:center;gap:6px}
.cycle-nav .lbl{font-family:var(--mono);font-size:13px;min-width:170px;text-align:center}
.mode{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.mode button{border:0;background:var(--surface);padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.paint{margin-bottom:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:10px}
.paint .chip{cursor:pointer;border:2px solid transparent;height:28px}
.paint .chip[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.grid .dh{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.wk{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 2px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.wk b{font-family:var(--mono);color:var(--ink);font-weight:600}
.cell{--c:var(--line-strong);position:relative;text-align:start;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 32%,var(--line));border-top:4px solid var(--c);border-radius:7px;padding:8px 9px 9px;min-height:112px;display:flex;flex-direction:column;gap:5px;transition:transform .12s ease,box-shadow .12s ease}
.cell:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cell.empty{background:var(--surface-2);border-style:dashed;border-top-width:1px}
.cell.is-today{box-shadow:0 0 0 2px var(--accent)}
.cell .top-l{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.cell .dnum{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1}
.cell .mon{font-size:11px;color:var(--muted)}
.cell .day{font-size:11.5px;color:var(--muted);line-height:1.2}
.cell .nm{font-size:12.5px;font-weight:600;line-height:1.2}
.cell .tm{font-family:var(--mono);font-size:11px;color:var(--muted);direction:ltr;text-align:right}
.cell .hrs{font-family:var(--mono);font-size:12px;margin-top:auto}
.cell .flag{position:absolute;top:6px;inset-inline-end:6px;font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px;line-height:17px}
.cell .was{font-size:10.5px;color:var(--muted);display:flex;gap:4px;align-items:center}
.cell .was .chip{height:16px;min-width:22px;font-size:10px;padding:0 4px}
.cell .note-dot{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){
  .grid{gap:4px}
  .cell{min-height:86px;padding:6px 5px;gap:3px}
  .cell .tm,.cell .nm,.cell .note-dot,.cell .mon,.cell .day{display:none}
  .cell .dnum{font-size:14px}
  .cell .chip{min-width:0;padding:0 4px;font-size:11px;height:20px}
  .cell .was{display:none}
  .cell .flag{top:3px;inset-inline-end:3px;padding:0 3px;font-size:9px;line-height:14px}
  .cycle-nav .lbl{min-width:0}
}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;text-align:start;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.arrow{color:var(--muted);font-family:var(--mono)}
.empty-state{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px}
.types td input[type=text],.types td input[type=time]{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 8px;width:100%;min-width:70px}
.types td input.code{font-family:var(--mono);font-weight:600;width:70px;text-transform:uppercase}
.types input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
.settings{margin-top:16px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.settings .field{display:flex;flex-direction:column;gap:6px}
.hint{font-size:12.5px;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,20,24,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.m-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.m-body{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.m-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m-foot .sp{flex:1}
.label{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px 6px 8px;display:flex;align-items:center;gap:8px;font-size:13px}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr 110px;gap:10px;align-items:end}
@media (max-width:480px){.row2{grid-template-columns:1fr 1fr}.row2 .calc{grid-column:1/-1}}
.inp{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:8px 10px}
textarea.inp{min-height:62px;resize:vertical}
.calc{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 10px;font-family:var(--mono);text-align:center}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.cmp .side{display:flex;flex-direction:column;gap:4px}
.cmp .t{font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.hist{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.t12{direction:ltr;unicode-bidi:isolate;display:inline-block}
.rota{overflow:hidden}
table.rl{font-size:12px;border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.rl th,table.rl td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);white-space:nowrap}
table.rl th{font-weight:500;font-size:11px;background:var(--surface-2)}
table.rl th .mono{font-size:10.5px;color:var(--ink);font-weight:600}
table.rl .sticky{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;text-align:start;padding-inline:10px;min-width:120px;font-weight:600;font-size:12px}
table.rl th.sticky{background:var(--surface-2);font-size:11px;color:var(--muted);white-space:normal;max-width:150px}
table.rl .wks{border-inline-start:2px solid var(--line-strong)}
table.rl .tdy{background:var(--accent-soft)}
table.rl tr.oh td{font-family:var(--mono);color:var(--muted);font-size:11px}
table.rl tr.orow td{font-family:var(--mono);color:var(--muted);font-size:11px}
table.rl .sum{font-weight:600;min-width:62px;background:var(--surface-2)}
.rc{--c:var(--line);width:34px;height:30px;border-radius:5px;border:0;background:var(--c);color:var(--ct,var(--muted));font-family:var(--mono);font-weight:600;font-size:11.5px}
.rc.chg{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--warn)}
.balp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;padding:0;text-align:start;overflow:hidden;width:100%}
.balp .bp{padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-inline-start:1px solid var(--line)}
.balp .bp:first-child{border-inline-start:0}
.balp .bp .l{font-size:12px;color:var(--muted)}
.balp .bp .v{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.balp .bp.main{background:var(--accent-soft)}
.balp .bp.main .v{font-size:17px}
.balp:hover{box-shadow:var(--shadow)}
table.ledger td{vertical-align:top}
table.ledger tr.now td{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.nowrap{white-space:nowrap}
.stat .v.bv{font-family:var(--sans);font-size:22px;font-weight:700}
.balp .bp .v{font-family:var(--sans)!important}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
let LANG="ar"; try{ LANG=localStorage.getItem("duty-roster-v2:lang")||"ar"; }catch(e){}
const EN=LANG==="en";
if(EN){ document.documentElement.lang="en"; document.documentElement.dir="ltr"; }
const DAYS=EN?["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]:["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS=EN?["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]:["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const LS_KEY="duty-roster-v2";
const DOC_PATH="roster/main";

/* ---------- dates (UTC math on ISO strings) ---------- */
const toD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));};
const iso=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);};
const dow=s=>toD(s).getUTCDay();
const todayIso=()=>{const n=new Date();return iso(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())));};
const sundayOf=s=>addDays(s,-dow(s));
const fmtShort=s=>{const d=toD(s);return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()];};
const fmtLong=s=>DAYS[dow(s)]+" "+fmtShort(s)+" "+toD(s).getUTCFullYear();
const fmtStamp=t=>{const d=new Date(t);return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()+" · "+fmt12(String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"));};

/* ---------- time ---------- */
function fmt12(t){ if(!t) return ""; let [h,m]=t.split(":").map(Number); const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+String(m).padStart(2,"0")+" "+ap; }
function diffH(a,b){ if(!a||!b) return 0; const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number); let x=(h2*60+m2)-(h1*60+m1); if(x<=0) x+=1440; return Math.round(x/6)/10; }
const fmtH=n=>(Math.round(n*10)/10).toString();

/* ---------- state ---------- */
const DEFAULT_TYPES=[
  {code:"M",name:"Morning",start:"07:00",end:"14:00",color:"#E9A91E",work:true},
  {code:"E",name:"Evening",start:"14:00",end:"21:00",color:"#DD6A34",work:true},
  {code:"N",name:"Night",start:"21:00",end:"07:00",color:"#3B4FA6",work:true},
  {code:"O",name:"Off",start:"",end:"",color:"#8E9CA2",work:false},
  {code:"L",name:"Leave",start:"",end:"",color:"#2A9467",work:false},
  {code:"SL",name:"Sick Leave",start:"",end:"",color:"#C83D57",work:false},
  {code:"AL",name:"Annual Leave",start:"",end:"",color:"#6FA86A",work:false},
  {code:"PO",name:"PO",start:"",end:"",color:"#A77BC4",work:false},
  {code:"CE",name:"Continuing Education",start:"07:00",end:"14:00",color:"#2B8FB3",work:true},
  {code:"OC",name:"On Call",start:"",end:"",color:"#5E6B70",work:false},
  {code:"M1",name:"M1",start:"07:00",end:"14:00",color:"#D94C8A",work:true}
];
const DEFAULT_CFG={official:7,weekend:[5,6],unit:"Suhar Hospital · Main Operation Theater",name:"Ahmed Ali Al Mamari",staff:"76221"};
function sampleState(){
  const start="2026-09-20";
  const pat="N N O O M E O M E E E O O O M E O M M1 O E O CE M M N O M".split(" ");
  const st={v:1,sample:false,cfg:{...DEFAULT_CFG},start,types:JSON.parse(JSON.stringify(DEFAULT_TYPES)),original:{},days:{},log:[]};
  pat.forEach((c,i)=>{const t=DEFAULT_TYPES.find(x=>x.code===c);st.original[addDays(start,i)]={code:c,start:t.start,end:t.end};});
  return st;
}
function emptyState(keepTypes){
  return {v:1,sample:false,cfg:(S&&S.cfg)||{...DEFAULT_CFG},start:sundayOf(todayIso()),types:keepTypes||JSON.parse(JSON.stringify(DEFAULT_TYPES)),original:{},days:{},log:[]};
}
let S=null;
try{ const raw=localStorage.getItem(LS_KEY); if(raw) S=JSON.parse(raw);}catch(e){}
if(!S||!S.types) S=sampleState();
function norm(){ if(!S.cfg) S.cfg={...DEFAULT_CFG}; if(!S.bal) S.bal={from:"2026-09-20",po:77,hrs:6}; if(!S.adj) S.adj={}; }
norm();

const SUPABASE_URL = "https://uprtxqnjajtmvhxwicaq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwcnR4cW5qYWp0bXZoeHdpY2FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODE0NzYsImV4cCI6MjEwNTc1NzQ3Nn0.DAWlaysrAViFIZS6ss3bWWRWf0lf555KZA_oNiPZjo4";
const SUPABASE_TABLE = "roster_data";
const SUPABASE_USER = "ahmed";
const supabaseClient = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

let db=null, docRef=null, saveTimer=null, saving=false, pendingSave=false, dirty=false, gotRemote=false;
const saveEl=document.getElementById("save");
function setSave(kind,txt){saveEl.className="save "+kind;saveEl.querySelector("span").textContent=txt;}

function persist(){
  dirty=true;
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  try{localStorage.setItem(LS_KEY+":ts",String(Date.now()));}catch(e){}
  if(!docRef&&!supabaseClient){ setSave("local","محفوظ على هذا الجهاز فقط"); return; }
  setSave("busy","جارٍ الحفظ…");
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,500);
}
async function flush(){
  if(!docRef&&!supabaseClient) return;
  if(saving){pendingSave=true;return;}
  saving=true;
  try{
    if(docRef){ await docRef.set(JSON.parse(JSON.stringify(S))); }
    else {
      const now=new Date().toISOString();
      const {error}=await supabaseClient.from(SUPABASE_TABLE).upsert({user_id:SUPABASE_USER,data:S,updated_at:now},{onConflict:"user_id"});
      if(error) throw error;
      try{localStorage.setItem(LS_KEY+":synced",now);}catch(e){}
    }
    dirty=false; setSave("","محفوظ في Supabase"); }
  catch(e){ console.error("Supabase save:",e); setSave("local", sbErrText(e)); }
  saving=false;
  if(pendingSave){pendingSave=false;flush();}
}

/* ---------- helpers ---------- */
const typeOf=c=>S.types.find(t=>t.code===c);
const cur=d=>S.days[d]||S.original[d]||null;
function sameShift(a,b){ if(!a&&!b) return true; if(!a||!b) return false; return a.code===b.code&&(a.start||"")===(b.start||"")&&(a.end||"")===(b.end||""); }
const isChanged=d=>!!S.days[d]&&!sameShift(S.days[d],S.original[d]);
function hoursOf(e){ if(!e) return 0; const t=typeOf(e.code); if(!t||!t.work) return 0; return diffH(e.start,e.end); }
function textOn(hex){ const h=(hex||"#888").replace("#",""); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); const L=(0.299*r+0.587*g+0.114*b)/255; return L>0.62?"#10272F":"#FFFFFF"; }
function chip(code,cls){ const t=typeOf(code); const c=t?t.color:"#888"; return `<span class="chip ${cls||""}" style="--c:${c};--ct:${textOn(c)}">${esc(code||"?")}</span>`; }
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function timeRange(e){ return e&&e.start&&e.end? fmt12(e.start)+" – "+fmt12(e.end):""; }
function shiftLabel(e){ if(!e) return "غير محدد"; const t=typeOf(e.code); return t?t.name:e.code; }
function isLeave(e){ if(!e) return false; const t=typeOf(e.code); return !!t&&!t.work&&e.code!=="O"&&e.code!=="OC"; }
function officialOf(d){ return S.cfg.weekend.includes(dow(d))?0:(+S.cfg.official||0); }
function dueOf(dates){ return dates.reduce((a,d)=>a+(isLeave(cur(d))?0:officialOf(d)),0); }
function poH(){ return +S.cfg.official||7; }
function balParts(h){ let a=Math.round(Math.abs(h)*10)/10; const d=Math.floor(a/poH()+1e-9); const r=Math.round((a-d*poH())*10)/10; const parts=[]; if(d) parts.push(d+" يوم"); if(r) parts.push(fmtH(r)+" س"); return parts.length?parts.join(" و "):"0"; }
function fmtBal(h){ return (h<0?"سالب ":"")+balParts(h); }
function fmtBalShort(h){ const neg=h<0; let a=Math.round(Math.abs(h)*10)/10; const d=Math.floor(a/poH()+1e-9); const r=Math.round((a-d*poH())*10)/10; return {sign:neg?"−":"",po:d,hrs:r}; }
function fmtSigned(h){ return h>0?"زيادة "+balParts(h):h<0?"نقص "+balParts(h):"بدون تغيير"; }
function ledger(){
  const out=[]; const openH=(+S.bal.po||0)*poH()+(+S.bal.hrs||0);
  let bal=openH; let st=S.bal.from;
  const keys=[...Object.keys(S.original),...Object.keys(S.days)].sort();

async function loadSupabase(){

  setSave("busy","جارٍ التحميل من Supabase…");
  try{
    const {data,error}=await supabaseClient.from(SUPABASE_TABLE).select("data,updated_at").eq("user_id",SUPABASE_USER).maybeSingle();
    if(error) throw error;
    let localTs=0, synced=""; try{ localTs=+localStorage.getItem(LS_KEY+":ts")||0; synced=localStorage.getItem(LS_KEY+":synced")||""; }catch(e){}
    if(data && data.data && data.data.types){
      const remoteTs=Date.parse(data.updated_at)||0;
      const localUnsynced = localTs && (!synced || localTs > Date.parse(synced)+2000);
      if(localUnsynced && localTs>remoteTs){ await flush(); }
      else {
        S=data.data; norm(); viewStart=S.start;
        try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); localStorage.setItem(LS_KEY+":synced",data.updated_at); localStorage.setItem(LS_KEY+":ts",String(remoteTs)); }catch(e){}
        render(); setSave("","محفوظ في Supabase");

  }
}

function shiftClock(){
  // returns {state:"now"|"soon"|"later", text} for the shift in progress or the next one
  const now=new Date(); const today=todayIso(); const mins=now.getHours()*60+now.getMinutes();
  const toM=t=>{const [h,m]=t.split(":").map(Number);return h*60+m;};
  const y=cur(addDays(today,-1));
  if(y&&y.start&&y.end&&typeOf(y.code)&&typeOf(y.code).work&&toM(y.end)<=toM(y.start)&&mins<toM(y.end))
    return {state:"now",text:"شفت "+esc(shiftLabel(y))+" جارٍ · باقي "+fmtDur(toM(y.end)-mins)};
  const e=cur(today);
  if(e&&e.start&&e.end&&typeOf(e.code)&&typeOf(e.code).work){
    const s=toM(e.start), en=toM(e.end)<=s?toM(e.end)+1440:toM(e.end);
    if(mins<s) return {state:"soon",text:"يبدأ بعد "+fmtDur(s-mins)};
    if(mins<en) return {state:"now",text:"الشفت جارٍ · باقي "+fmtDur(en-mins)};
  }
  for(let i=1;i<=14;i++){ const d=addDays(today,i), x=cur(d); if(x&&typeOf(x.code)&&typeOf(x.code).work&&x.start)
    return {state:"later",text:"الشفت القادم: "+esc(shiftLabel(x))+" · "+(i===1?"غداً":DAYS[dow(d)]+" "+fmtShort(d))+' · <span class="t12">'+fmt12(x.start)+"</span>"}; }
  return null;
}

function viewStats(){

    (byT[e.code]=byT[e.code]||{n:0,h:0}); byT[e.code].n++; byT[e.code].h+=h; hours+=h;
    if(t&&t.work){ workDays++; if(W.includes(dow(d))) weekendWork++; } else if(e.code==="O") offDays++; else leaveDays++;
    if(e.code==="N") nights++; });
  const due=dueOf(D);
  // streaks
  let wS=0,wMax=0,oS=0,oMax=0,nS=0,nMax=0,mAfterN=0,prev=null;

    wS=work?wS+1:0; wMax=Math.max(wMax,wS); oS=(e&&!work)?oS+1:0; oMax=Math.max(oMax,oS);
    nS=(e&&e.code==="N")?nS+1:0; nMax=Math.max(nMax,nS);

    prev=e; });

  const maxN=Math.max(1,...mix.map(m=>m.n));

  } else {

  return `<div class="page-head"><div><h1>الإحصائيات</h1><p>${statScope==="cycle"?`الروته ${fmtShort(S.start)} – ${fmtShort(addDays(S.start,27))}`:`من ${fmtShort(D[0])} ${toD(D[0]).getUTCFullYear()} إلى ${fmtShort(D[D.length-1])}`}</p></div>

    <div class="card"><div class="card-l">شفتات Night</div><div class="big">${nights}</div><div class="card-f"><span>أطول تتابع</span><b>${nMax} ليالي</b></div></div>
    <div class="card"><div class="card-l">دوام في الويكند</div><div class="big">${weekendWork}</div><div class="card-f"><span>من أصل ${workDays} يوم عمل</span></div></div>
    <div class="card"><div class="card-l">التغييرات</div><div class="big">${logs.length}</div><div class="card-f"><span>${topP[0]?"الأكثر: "+esc(topP[0][0]):"لا توجد تغييرات"}</span></div></div>
  </div>

  <div class="st-grid">

    <section class="card"><div class="st-h"><h2>توزيع الشفتات</h2><span class="hint">${D.filter(d=>cur(d)).length} يوم</span></div>

      </tbody></table></div></section>
  </div>`;
}

const SB_LS=LS_KEY+":supabase";
const SB_SQL=`create table if not exists public.roster (
  user_id uuid primary key default auth.uid() references auth.users on delete cascade,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.roster enable row level security;
create policy "own roster" on public.roster
  for all using (auth.uid() = user_id) with check (auth.uid() = user_id);`;
let SB=(()=>{ try{ return JSON.parse(localStorage.getItem(SB_LS)||"{}"); }catch(e){ return {}; } })();
let sbTimer=null, sbBusy=false, sbAgain=false, sbMsg="";
function sbSave(){ try{ localStorage.setItem(SB_LS,JSON.stringify(SB)); }catch(e){} }
const sbOn=()=>!window.claude&&SB.url&&SB.key&&SB.access;
function sbBase(){ return String(SB.url||"").trim().replace(/\/+$/,""); }
async function sbAuth(path,body){
  const r=await fetch(sbBase()+"/auth/v1/"+path,{method:"POST",headers:{"apikey":SB.key,"content-type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw {msg:j.error_description||j.msg||j.message||("خطأ "+r.status)};
  return j;
}
function sbTakeSession(j){ SB.access=j.access_token; SB.refresh=j.refresh_token; SB.uid=j.user&&j.user.id; SB.email=j.user&&j.user.email; sbSave(); }
async function sbRefresh(){ const j=await sbAuth("token?grant_type=refresh_token",{refresh_token:SB.refresh}); sbTakeSession(j); }
async function sbFetch(path,opt,retry){
  const o=Object.assign({},opt||{}); o.headers=Object.assign({"apikey":SB.key,"Authorization":"Bearer "+SB.access,"content-type":"application/json"},o.headers||{});
  const r=await fetch(sbBase()+"/rest/v1/"+path,o);
  if(r.status===401&&!retry&&SB.refresh){ await sbRefresh(); return sbFetch(path,opt,true); }
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw {msg:(j.message||("خطأ "+r.status))+(j.code==="42P01"||/relation .* does not exist/.test(j.message||"")?" — أنشئي جدول roster بالكود من الإعدادات":"")}; }
  return r.status===204?null:r.json().catch(()=>null);
}
function localTs(){ try{ return +localStorage.getItem(LS_KEY+":ts")||0; }catch(e){ return 0; } }

async function sbPush(){
  if(!sbOn()) return; if(sbBusy){ sbAgain=true; return; } sbBusy=true;
  setSave("busy","جارٍ المزامنة…");
  try{ const now=new Date().toISOString();
    await sbFetch("roster?on_conflict=user_id",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:SB.uid,data:S,updated_at:now})});
    SB.synced=now; sbSave(); setSave("","متزامن مع Supabase"); sbMsg=""; }
  catch(e){ sbMsg=e&&e.msg||"تعذّرت المزامنة"; setSave("local","محفوظ محلياً — المزامنة متوقفة"); }
  sbBusy=false; if(sbAgain){ sbAgain=false; sbPush(); }
}
function sbSchedule(){ setLocalTs(Date.now()); if(!sbOn()) return; clearTimeout(sbTimer); setSave("busy","جارٍ المزامنة…"); sbTimer=setTimeout(sbPush,800); }
async function sbPull(){
  if(!sbOn()) return;
  setSave("busy","جارٍ المزامنة…");
  try{
    const rows=await sbFetch("roster?select=data,updated_at&user_id=eq."+encodeURIComponent(SB.uid));
    const row=rows&&rows[0];
    if(row&&row.data&&row.data.types){
      const remoteT=Date.parse(row.updated_at)||0;
      if(remoteT>=localTs()||!SB.synced){ S=row.data; norm(); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} setLocalTs(remoteT); viewStart=S.start; SB.synced=row.updated_at; sbSave(); render(); setSave("","متزامن مع Supabase"); }
      else { await sbPush(); }
    } else { await sbPush(); }
    sbMsg="";
  }catch(e){ sbMsg=e&&e.msg||"تعذّرت المزامنة"; setSave("local","محفوظ محلياً — المزامنة متوقفة"); }
  if(tab==="types") render();
}

  const url=document.getElementById("sb-url").value.trim(), key=document.getElementById("sb-key").value.trim(), email=document.getElementById("sb-email").value.trim(), pass=document.getElementById("sb-pass").value;

    const n=dark?"light":"dark"; try{ localStorage.setItem(LS_KEY+":theme",n); }catch(e){} apply(n); });
})();
document.getElementById("lock-btn").addEventListener("click",()=>{ if(isUnlocked()){ lockNow(); toast("تم القفل"); } else { pinPending=null; showPin(); } });
updLockBtn();
/* ---------- boot ---------- */
render();
loadSupabase();
})();
</script>
